<!doctype html>
<!--
  OGP画像（1200×630）の版下。
  これ自体はサイトに配信されない。`npm run og` で public/og.png に書き出す。
  文言やブランドを変えたときは、このファイルを直してから再生成する。
-->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --navy: #0a2350;
        --blue: #1668c9;
        --blue-ink: #0f4f9e;
        --sky-soft: #f2f7fc;
        --gold: #c2a052;
        --text-mute: #5b6c86;
        --line: #dbe4ef;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
      }

      body {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 372px;
        background: #fff;
        color: var(--navy);
        font-family: "Helvetica Neue", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
        font-feature-settings: "palt" 1;
        overflow: hidden;
      }

      /* 右側の淡いブルーの色面（サイトのファーストビューと同じ構成） */
      .panel {
        background: var(--sky-soft);
        padding: 64px 56px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .main {
        padding: 64px 0 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .logo {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .label {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 8px;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--blue-ink);
      }

      .label::before {
        content: "";
        width: 40px;
        height: 4px;
        background: var(--gold);
        flex: none;
      }

      h1 {
        font-size: 76px;
        font-weight: 700;
        line-height: 1.24;
        letter-spacing: 0.01em;
      }

      h1 em {
        font-style: normal;
        color: var(--blue);
      }

      .lead {
        margin-top: 24px;
        font-size: 21px;
        line-height: 1.75;
        color: var(--text-mute);
      }

      .domain {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--navy);
      }

      .panel-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: var(--blue-ink);
        padding-bottom: 18px;
        border-bottom: 3px solid var(--gold);
      }

      ul {
        list-style: none;
        padding: 0;
      }

      li {
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
        font-size: 23px;
        font-weight: 700;
      }

      li:last-child {
        border-bottom: 0;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div>
        <p class="logo">シクミベース</p>
        <p class="label">茨城・近隣の住宅リフォーム会社向け</p>
      </div>

      <div>
        <h1>反響対応を、<br /><em>記憶に任せない。</em></h1>
        <p class="lead">
          問い合わせから見積後3回のフォローまで、<br />
          30日で動くひとつの営業フローに。
        </p>
      </div>

      <p class="domain">shikumi-base.com</p>
    </div>

    <div class="panel">
      <p class="panel-title">REFORM LEAD OS 30</p>
      <ul>
        <li>受信確認</li>
        <li>現調前の情報回収</li>
        <li>案件台帳・通知</li>
        <li>見積フォロー</li>
      </ul>
    </div>
  </body>
</html>
