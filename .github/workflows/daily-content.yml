name: Daily SEO and content

on:
  schedule:
    # 毎朝7:00（JST）= 前日22:00（UTC）
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: daily-seo-content
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/663019962404/locations/global/workloadIdentityPools/github-actions/providers/github-home
          service_account: shikumi-base-automation@ibatoco-seo.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/webmasters.readonly
            https://www.googleapis.com/auth/analytics.readonly

      - name: Create daily SEO report
        id: growth
        continue-on-error: true
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          GSC_SITE_URL: sc-domain:shikumi-base.com
          GA4_PROPERTY_ID: '516899437'
        run: npm run growth

      - name: Select article topic
        id: topic
        if: steps.growth.outcome == 'success'
        run: >-
          node scripts/select-daily-topic.mjs
          --focus-rule "${{ steps.growth.outputs.focus_rule }}"
          --focus-category "${{ steps.growth.outputs.focus_category }}"
          --focus-keyword "${{ steps.growth.outputs.focus_keyword }}"

      - name: Prepare article prompt
        id: prompt
        if: steps.growth.outcome == 'success' && steps.topic.outputs.has_topic == 'true'
        run: >-
          node scripts/generate-article.mjs
          --category "${{ steps.topic.outputs.category }}"
          --keyword "${{ steps.topic.outputs.keyword }}"
          --slug "${{ steps.topic.outputs.slug }}"
          --prompt-output "${{ runner.temp }}/article-prompt.md"

      - name: Generate article with Cloudflare Workers AI
        id: inference
        if: steps.prompt.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: e384269f44b7b1195054555fa2cd89ab
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
        run: >-
          node scripts/infer-article.mjs
          --prompt-file "${{ runner.temp }}/article-prompt.md"
          --output-file "${{ runner.temp }}/article-response.md"

      - name: Save article publication candidate
        id: article
        if: steps.inference.outcome == 'success'
        continue-on-error: true
        run: >-
          node scripts/generate-article.mjs
          --category "${{ steps.topic.outputs.category }}"
          --keyword "${{ steps.topic.outputs.keyword }}"
          --slug "${{ steps.topic.outputs.slug }}"
          --response-file "${{ runner.temp }}/article-response.md"

      - name: Verify all changes
        id: verify
        continue-on-error: true
        run: npm run verify

      - name: Remove rejected article and keep the report
        if: steps.article.outcome == 'success' && steps.verify.outcome == 'failure'
        run: |
          article_path="src/content/knowledge/${{ steps.topic.outputs.slug }}.md"
          if [ -f "$article_path" ]; then
            rm -- "$article_path"
          fi
          npm run verify

      - name: Check whether anything changed
        id: changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update daily pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report_date="$(TZ=Asia/Tokyo date +%F)"
          branch="automation/daily-seo-${report_date}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add docs/seo-log src/content/knowledge
          git commit -m "Daily SEO report and content draft ${report_date}"
          git push --force-with-lease origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Daily SEO report and content draft ${report_date}" \
            --body "Search Console・GA4を基にした日次レポートと記事の公開候補です。型・ビルド・品質検査は通過済みです。内容と根拠を確認し、問題なければこのPRをマージするとCloudflare Pagesへ公開されます。" \
          || gh pr edit "$branch" \
              --title "Daily SEO report and content draft ${report_date}" \
              --body "Search Console・GA4を基にした日次レポートと記事の公開候補です。型・ビルド・品質検査は通過済みです。内容と根拠を確認し、問題なければこのPRをマージするとCloudflare Pagesへ公開されます。"

      - name: Stop when configured analytics is unavailable
        if: always() && steps.growth.outcome == 'failure'
        run: |
          echo "::error::設定済みのSearch ConsoleまたはGA4からデータを取得できませんでした。Actions Summaryの原因を確認してください。"
          exit 1

      - name: Stop when article generation fails
        if: >-
          always() && steps.topic.outputs.has_topic == 'true' &&
          (steps.inference.outcome != 'success' || steps.article.outcome != 'success' ||
          steps.verify.outcome != 'success')
        run: |
          echo "::error::記事の生成または品質確認に失敗しました。日次レポートのPRは作成済みです。"
          exit 1
